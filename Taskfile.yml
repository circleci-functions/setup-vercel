version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  fmt:
    desc: Format Go code (gofmt + goimports)
    cmds:
      - go tool golangci-lint fmt

  lint:
    desc: Lint Go code (includes go vet via golangci-lint)
    cmds:
      - go tool golangci-lint run ./...

  test:
    desc: Run unit and CLI tests (hermetic, no network)
    cmds:
      - go tool gotestsum --junitfile test-results/unit.xml -- ./...

  acceptance:
    desc: Run acceptance tests with the real Vercel CLI against a fake Vercel API (needs Node.js and npm)
    cmds:
      - go tool gotestsum --junitfile test-results/acceptance.xml --format standard-verbose -- -tags acceptance -timeout 20m ./acceptance/...

  build-acceptance:
    desc: Cross-compile the acceptance suite, so an executor with no Go can run it
    cmds:
      - |
        set -eu
        for platform in linux/amd64 darwin/arm64 windows/amd64; do
          os="${platform%/*}"; arch="${platform#*/}"
          out="dist/acceptance/$os/$arch/acceptance"
          if [ "$os" = windows ]; then out="$out.exe"; fi
          # CGO_ENABLED=0 so the binary is static: building linux/amd64 on a
          # linux/amd64 host is not a cross-compile, so cgo would otherwise
          # stay on and tie it to the builder's glibc.
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go test -c -tags acceptance -o "$out" ./acceptance
          echo "built $out"
        done

  build-tools:
    desc: >-
      Cross-compile test2json and gotestsum, so an executor with no Go can turn
      the packaged suite's output into the JUnit XML CircleCI collects.
    cmds:
      - |
        set -eu
        for platform in linux/amd64 darwin/arm64 windows/amd64; do
          os="${platform%/*}"; arch="${platform#*/}"
          ext=""
          if [ "$os" = windows ]; then ext=".exe"; fi
          for tool in cmd/test2json gotest.tools/gotestsum; do
            name="${tool##*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -o "dist/tools/$os/$arch/$name$ext" "$tool"
          done
          echo "built dist/tools/$os/$arch/{test2json,gotestsum}$ext"
        done

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  lint-tasks:
    desc: Check every task the CI config invokes exists
    cmds:
      - |
        set -eu
        # Read the Taskfile rather than ask the task binary: --list output has
        # changed between versions, and an empty answer would pass everything
        # or fail everything.
        defined=" $(grep -oE '^  [a-z][a-z-]*:' Taskfile.yml | tr -d ' :' | tr '\n' ' ')"
        missing=""
        for t in $(grep -v '^[[:space:]]*#' .circleci/config.yml \
                   | grep -oE 'task [a-z][a-z-]*' | awk '{print $2}' | sort -u); do
          case "$defined" in *" $t "*) ;; *) missing="$missing $t" ;; esac
        done
        if [ -n "$missing" ]; then
          echo "CI config invokes tasks that do not exist:$missing" >&2
          exit 1
        fi

  lint-mod:
    desc: Check go.mod / go.sum are tidy
    deps: [tidy]
    cmds:
      - git diff --exit-code -- go.mod go.sum

  dry-run:
    desc: Cross-compile setup-vercel locally, without uploading
    cmds:
      - go tool release --name setup-vercel --version v0.0.0-dryrun --dry-run

  ci:
    desc: Run everything CI runs (lint + test + dry-run)
    cmds:
      - task: lint
      - task: lint-tasks
      - task: test
      - task: dry-run

  publish:
    desc: Build and publish setup-vercel to S3 (VERSION required)
    requires:
      vars: [VERSION]
    cmds:
      - go tool release --name setup-vercel --version "{{.VERSION}}"
