version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # The acceptance tests install the real Vercel CLI, which needs Node.js.
  go-node:
    docker:
      - image: cimg/go:1.26-node
  # The smoke jobs run the packaged binary and suite, so they need Node.js
  # for the Vercel CLI but no Go.
  node:
    docker:
      - image: cimg/node:lts
  # A VM where the directories on PATH are root-owned, so linking vercel onto
  # PATH takes a different route than in a container.
  machine:
    machine:
      image: ubuntu-2404:current
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

commands:
  smoke:
    description: >-
      Run the packaged acceptance suite against the packaged setup-vercel: the
      real Vercel CLI from npm, against the suite's in-process fake Vercel API.
      The executor needs Node.js but no Go, no modules and no checkout: test2json
      and gotestsum turn the suite's output into the JUnit CircleCI collects.
    parameters:
      platform:
        type: string
        description: The os/arch whose artifacts to run, e.g. linux/amd64.
      ext:
        type: string
        default: ""
        description: Executable suffix for the platform.
    steps:
      - run:
          name: Install the Vercel CLI, put it on PATH and deploy
          command: |
            node --version
            mkdir -p test-results
            ./dist/tools/<< parameters.platform >>/gotestsum<< parameters.ext >> \
              --junitfile test-results/smoke.xml \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json<< parameters.ext >> \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance<< parameters.ext >> \
                -test.v=test2json \
                -test.run 'TestAcceptance_LinksOntoTheRealPath|TestAcceptance_SetupInstallsLinksAndPulls|TestAcceptance_DeployPreviewPrebuilt'
          environment:
            SETUP_VERCEL_BINARY: ./dist/setup-vercel/<< parameters.platform >>/setup-vercel<< parameters.ext >>
      - store_test_results:
          path: test-results

jobs:
  test:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-vercel-go-{{ checksum "go.sum" }}-
            - setup-vercel-go-
      - run: task lint
      # A release is the only thing that runs `task publish`, so a missing task
      # would otherwise surface at release time.
      - run: task lint-tasks
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-vercel-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-vercel into ./dist the way `publish` will, plus the
  # acceptance suite and the tools to report it, and persists them so the
  # smoke jobs exercise exactly what is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-vercel-go-{{ checksum "go.sum" }}-
            - setup-vercel-go-
      - run: task dry-run
      - run: task build-acceptance
      - run: task build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # The real Vercel CLI, installed from npm, against a fake Vercel API.
  acceptance:
    executor: go-node
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-vercel-go-{{ checksum "go.sum" }}-
            - setup-vercel-go-
      - run:
          name: Run acceptance tests
          command: task acceptance
          environment:
            # The CLI install goes through the job's own cache, so the
            # round-trip is exercised for real. The suite fails rather than
            # falling back if it can't reach it.
            TOOLKIT_CACHE_MODE: live
      - store_test_results:
          path: test-results

  smoke-linux:
    executor: node
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-machine:
    executor: machine
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-macos:
    executor: macos
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: darwin/arm64

  smoke-windows:
    executor: windows
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: windows/amd64
          ext: ".exe"

workflows:
  test-publish:
    jobs:
      - test
      - build
      - acceptance
      - smoke-linux:
          requires: [build]
      - smoke-machine:
          requires: [build]
      - smoke-macos:
          requires: [build]
      - smoke-windows:
          requires: [build]
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-vercel-go
          # One at a time, so two pushes can't race to rewrite release/next.
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires
            - test
            - acceptance
            - smoke-linux
            - smoke-machine
            - smoke-macos
            - smoke-windows
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-vercel-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main
